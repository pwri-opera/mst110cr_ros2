amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "mst110cr_2/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "mst110cr_2/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: mst110cr_2/base_link
    odom_topic: /mst110cr_2/odom_pose

    # Resolved to params/navigate_to_pose_on_goal_update_w_recovery.xml by mst110cr_navigation.launch.py.
    default_nav_to_pose_bt_xml: ""

    bt_loop_duration: 100
    default_server_timeout: 20
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # Built-in Nav2 BT plugins are loaded automatically.
    # Omit plugin_lib_names when no custom plugins are needed: an empty YAML
    # list has no element type and can be rejected by ROS parameter conversion.


controller_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: /mst110cr_2/odom_pose

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.3
      movement_time_allowance: 60.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5  # m
      yaw_goal_tolerance: 0.15  # rad

    FollowPath:
      # BT selects FollowPath; the shim aligns only the goal heading, while MPPI tracks the path.
      # Same flat primary_controller layout as navigation_parameters_sim.yaml.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 3.2            # Above pi: disable initial/new-path heading alignment.
      angular_disengage_threshold: 0.392699  # Hand off below 22.5 deg (supported versions).
      forward_sampling_distance: 1.0
      rotate_to_heading_angular_vel: 0.1   # Match MPPI and velocity_smoother limits.
      max_angular_accel: 0.2                # Match velocity_smoother angular acceleration.
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false        # Initial/new-path alignment is disabled by the threshold above.
      use_path_orientations: false          # Face the sampled path position.
      # Ramp from the preceding command: near-zero odom must not trap the ramp in deadband.
      # Heading alignment still uses the measured robot pose.
      closed_loop: false

      # Primary MPPI parameters share the FollowPath namespace with the shim.
      time_steps: 200             # 28 候補軌道の時間ステップ数（データ点数）
      model_dt: 0.05            # 各時間ステップのdt（時間間隔）の長さ（秒単位）
      batch_size: 1000         # 特定の反復において、現在の最適制御シーケンスからランダムにサンプリングされた候補軌道の数。50 Hzでは1000、30 Hzでは2000が良好な結果をもたらす模様。
      ax_max: 12.0  # 3.0 # 6.0
      ax_min: -12.0  # -6.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 0.5  # 3.5 # 6.0
      vx_std: 0.3 # 0.5  # 1.5  # 0.5
      vy_std: 0.1
      wz_std: 0.08 # 2.0 # 0.2 # 0.08
      vx_max: 1.5
      vx_min: -1.5 # -0.6
      vy_max: 0.5
      wz_max: 0.15 # 1.9
      iteration_count: 1        # MPPIアルゴリズムの反復回数。1のままにしておくことを推奨
      prune_distance: 25.0    # 10秒の予測 × 前進上限1.5 m/sに余裕を確保
      transform_tolerance: 0.25
      temperature: 0.3          # MPPIアルゴリズムの温度パラメータ。値が小さいほど、最適な軌道に対する重みの差が大きくなる。
      gamma: 0.015             # MPPIアルゴリズムの割引率。将来のコストが現在のコストに与える影響を制御する。値が小さいほど、アルゴリズムはより短期的なコストに焦点を当てる。
      motion_model: "CrawlerDump" # humble_main_crawlerdumpで追加したクローラ用動モデル。
      CrawlerDumpConstraints:
        # 車体側crawler_controller.hppのFF係数と合わせる（自動同期なし）。
        track_width: 2.18                  # 左右クローラ中心間距離 [m]
        turn_response: 0.3280683958262127   # 旋回応答係数
        max_forward_speed: 2.0376389110634596 # 前進の等価速度上限 [m/s]
        max_reverse_speed: 2.0520782549587606 # 後退の等価速度上限の絶対値 [m/s]
        # 遅れは初期値0。MPPI出力から車体応答までの特性に合わせて設定する。
        delay_vx: 0.0                     # 並進の時間遅れ [s]
        delay_wz: 0.0                     # 旋回の時間遅れ [s]
        time_constant_vx: 0.0             # 並進の一次遅れ時定数 [s]
        time_constant_wz: 0.0             # 旋回の一次遅れ時定数 [s]
      visualize: true           #
      publish_optimal_trajectory: true # MPCによって計算された最適軌道（姿勢、速度、経由点のタイムスタンプ）を、可視化やデバッグのために公開する
      publish_critics_stats: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: # 使用するCriticプラグイン関数のベクトル。
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          # "PreferForwardCritic",
          # "VelocityDeadbandCritic"
        ]
      ConstraintCritic:  # 動的または運動学的制約の範囲外にある成分を含む軌道の評価を下げる
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:        # 目標に適切な距離まで近づいた際に、目標に向かって移動するよう促す
        enabled: true
        cost_power: 1
        cost_weight: 15.0  # 25.0 (10/27)
        threshold_to_consider: 7.0
      GoalAngleCritic:        # 目標位置に近い位置にいる際に、目標のポーズの角度に到達するよう誘導する
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.8
      # PreferForwardCritic: # 前進を好むように誘導する。
      #   enabled: false
      #   cost_power: 1
      #   cost_weight: 15.0  # 5.0
      #   threshold_to_consider: 8.0
      CostCritic: # コストマップのコストが高い位置を避けるように誘導する。コストマップのコストが高い位置を通る軌道の評価を下げる。
        enabled: false
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic: # 経路に沿うように誘導する。軌道の点が経路から遠いほど、コストが上がる。軌道の点が経路から近いほど、コストが下がる。
        enabled: true
        cost_power: 1
        cost_weight: 20.0  # 20.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 6.0
        offset_from_furthest: 8       # 候補となる軌道が、アライメント批評器を適用するために必要な経路追跡の過程において、十分に進行しているかどうかを確認します。これにより、実際に経路を追跡している場合にのみ経路アライメントが考慮されるようになり
        use_path_orientations: true    # 経路の整列処理において、経路の向きを考慮するかどうか。これは、実行可能なSMACプランナーと組み合わせることで、SMACプランナーが要求した場所・タイミングでのみ方向転換を行うよう促すのに有用
      PathFollowCritic:    # 経路に沿って移動するように誘導する。軌道の点が経路から遠いほど、コストが上がる。
        enabled: true
        cost_power: 1
        cost_weight: 15.0 # 5 # 20
        offset_from_furthest: 10 # 10
        threshold_to_consider: 6.0
      PathAngleCritic: # このクリティカル点は、経路に対して相対的な角度が大きい軌道をペナルティの対象とします
        enabled: true
        cost_power: 1
        cost_weight: 5.0  # 5.0
        offset_from_furthest: 4
        threshold_to_consider: 6.0 # ロボットと目標地点との距離（m）。この距離に達すると、経路の角度を考慮しなくなり、目標地点の判定ロジックが優先される。
        max_angle_to_furthest: 1.0
        mode: 2
      # VelocityDeadbandCritic:
      #   enabled: false
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.0, 0.00, 0.06]

local_costmap:
  local_costmap:
    ros__parameters:
      #Costmap2D paraneters
      use_sim_time: false
      always_send_full_costmap: True
      footprint_padding: 0.5
      global_frame: mst110cr_2/odom
      height: 60
      width: 60
      observation_sources: scan
      publish_frequency: 10.0
      resolution: 0.05
      robot_base_frame: mst110cr_2/base_link
      rolling_window: true
      transform_tolerance: 0.5
      update_frequency: 10.0
      plugins: ["static_layer", "inflation_layer"]

      # Obstacle Layer parameters
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: front/scan
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      #   sensor_frame: front_laser

      #Static Layer parameters
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        always_send_full_costmap: True

      # Voxel Layer parameters
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # Infration Layer parameters
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.60

global_costmap:
  global_costmap:
    ros__parameters:
      #Costmap2D paraneters
      use_sim_time: false
      always_send_full_costmap: True
      footprint_padding: 0.5
      global_frame: map
      height: 100
      width: 100
      observation_sources: scan
      origin_x: -20.0
      origin_y: -20.0
      publish_frequency: 10.0
      resolution: 0.1
      robot_base_frame: mst110cr_2/base_link
      rolling_window: false
      transform_tolerance: 0.5
      update_frequency: 10.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # Obstacle Layer parameters
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: front/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        sensor_frame: front_laser
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # Voxel Layer parameters
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 1
        z_voxels: 2

      # Infration Layer parameters
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      w_euc_cost: 1.0
      w_traversal_cost: 0.05
      # w_traversal_cost: 4.0


smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: mst110cr_2/odom
    global_frame: map
    robot_base_frame: mst110cr_2/base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 0.15]
    min_velocity: [-1.5, 0.0, -0.15]
    max_accel: [0.8, 0.0, 0.2]
    max_decel: [-1.0, 0.0, -0.3]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
